name: Validate plugin packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python scripts/build_plugins.py
      - run: python scripts/validate_plugins.py
      - run: git diff --exit-code -- plugins .agents
      - uses: actions/upload-artifact@v4
        with:
          name: agent-verification-plugins
          path: |
            dist/*.zip
            dist/SHA256SUMS
            validation-report.json
